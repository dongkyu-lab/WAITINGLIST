name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  cloud-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Verify different Google accounts, Firestore rules and live sync
        run: npm run test:cloud
  windows-installer:
    needs: cloud-rules
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install verified Electron runtime
        run: node node_modules/electron/install.js
      - name: Validate application
        run: npm test
      - name: Build desktop UI
        run: npm run build
      - name: Smoke test real Windows desktop runtime
        run: npm run desktop:smoke
      - name: Verify Google login screen blocks access before authentication
        run: npm run desktop:cloud-smoke
      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Test packaged Windows app
        run: node scripts/packaged-smoke.cjs
      - name: Test packaged Google login gate
        run: node scripts/cloud-packaged-smoke.cjs
      - name: Compute installer SHA256
        shell: pwsh
        run: |
          Get-ChildItem release/*-Setup.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)" | Out-File -Encoding ascii "release/$($_.Name).sha256"
          }
      - name: Retain installer
        uses: actions/upload-artifact@v4
        with:
          name: WaitingList-Windows-x64
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.sha256
          if-no-files-found: error
      - name: Publish tagged desktop release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem release/*-Setup.exe,release/*-Setup.exe.sha256 | ForEach-Object { $_.FullName }
          if ($env:GITHUB_REF_NAME -match '-rc\.') {
            gh release create $env:GITHUB_REF_NAME @assets --title "Waiting List $env:GITHUB_REF_NAME" --notes-file WINDOWS-RELEASE.md --prerelease --latest=false
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --title "Waiting List $env:GITHUB_REF_NAME" --notes-file WINDOWS-RELEASE.md --latest
          }
