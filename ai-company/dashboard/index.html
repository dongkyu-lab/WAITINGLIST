<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI회사 상황실</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <div class="logo">AI</div>
        <div>
          <div class="brand-name">AI회사 상황실</div>
          <div class="brand-sub" id="today">대표님 전용</div>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <nav class="wrap tabs" id="tabs" role="tablist"></nav>
  </header>
  <main class="wrap" id="view" aria-live="polite"></main>
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <div class="modal-head"><strong id="modal-title"></strong><button class="icon-btn" id="modal-close" aria-label="닫기">✕</button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
